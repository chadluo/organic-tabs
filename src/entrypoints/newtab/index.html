<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organic Tabs</title>
  <script src="/theme-boot.js"></script>
  <link rel="stylesheet" href="./newtab.css" />
</head>

<body>
  <template id="bookmark-link-template">
    <img class="favicon" alt="" />
    <span class="text-wrap"><a class="link"></a> <span class="hostname"></span></span>
  </template>

  <template id="tab-link-template">
    <img class="favicon" alt="" />
    <span class="text-wrap"><a class="link"></a> <span class="hostname"></span></span>
  </template>

  <template id="reading-list-link-template">
    <img class="favicon" alt="" />
    <span class="text-wrap"><a class="link"></a> <span class="hostname"></span></span>
  </template>

  <header id="ntp-header">
    <input type="text" id="ntp-title-input" autocomplete="off" spellcheck="false" />
    <button type="button" id="ntp-title-save" hidden>Save</button>
  </header>

  <main id="layout">
    <div id="left-column">
      <section id="bookmarks-section">
        <h2>Bookmarks</h2>
      </section>
      <section id="reading-list-section">
        <h2>Reading List</h2>
      </section>
    </div>
    <div id="right-column">
      <section id="tabs-section">
        <h2>Open Tabs</h2>
      </section>
    </div>
  </main>

  <dialog id="confirm-dialog" aria-labelledby="confirm-dialog-message">
    <p id="confirm-dialog-message"></p>
    <form method="dialog">
      <button value="cancel" id="confirm-dialog-cancel" autofocus>Cancel</button>
      <button value="ok" id="confirm-dialog-ok">OK</button>
    </form>
  </dialog>

  <script type="module" src="./newtab.ts"></script>
</body>

</html>
